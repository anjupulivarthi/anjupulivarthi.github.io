# Welcome to Jekyll!
# Site Configuration for Anju Pulivarthi

# Basic Site Settings
locale                  : "en-US"
location                : "Greater Bengaluru Area, India" 
site_theme              : "default"
title                   : "Anju Pulivarthi"
title_separator         : "-"
name                    : &name "Anju Pulivarthi"
description             : &description "Anju Pulivarthi | Academic Portfolio"
url                     : "https://anjupulivarthi.github.io"
baseurl                 : ""
repository              : "anjupulivarthi/anjupulivarthi.github.io"

# Site Author Sidebar Settings
author:
  # Biographic information
  avatar                : "ChatGPT Image Jun 17, 2026, 03_41_31 PM.png"
  name                  : "Anju Pulivarthi"
  pronouns              : ""
  bio                   : "Media & Communication Scholar researching AI-mediated communication, source authenticity, moving image studies, and Indian Eco-Cinema."
  location              : "Greater Bengaluru Area, India"
  employer              : "Ph.D. Applicant"
  uri                   : "https://anjupulivarthi.github.io/"
  email                 : "anjuchaudary53@gmail.com"

  # Academic websites
  googlescholar         : "y3mpZtcAAAAJ"
  orcid                 : "0009-0004-4722-0235"
  ssrn                  : "12826988"

  # Repositories and software development
  github                : "anjupulivarthi"

  # Social media
  linkedin              : "p-anju-50607b185"
  facebook              : "Anju-Chowdary"
  instagram             : "anju_pulivarthi"

# Publication Categories
publication_category:
  books:
    title: 'Books & Literary Works'
  manuscripts:
    title: 'Research Papers & Concept Notes'
  conferences:
    title: 'Conference Presentations'

# Site Settings
teaser                  : 
breadcrumbs             : false
words_per_minute        : 160
future                  : true
read_more               : "disabled"
talkmap_link            : false
comments:
  provider              : false

staticman:
  allowedFields         : ['name', 'email', 'url', 'message']
  branch                : "main"
  commitMessage         : "New comment."
  filename              : comment-{@timestamp}
  format                : "yml"
  moderation            : true
  path                  : "_data/comments/{options.slug}"
  requiredFields        : ['name', 'email', 'message']
  transforms:
    email               : "md5"
  generatedFields:
    date:
      type              : "date"
      options:
        format          : "iso8601"

atom_feed:
  hide                  : false
  path                  : 

# SEO Related
google_site_verification :
bing_site_verification   :
alexa_site_verification  :
yandex_site_verification :

# Social Sharing
twitter:
  username              : &twitter
facebook:
  username              :
  app_id                :
  publisher             :
og_image                :
og_description          :

social:
  type                  : Person
  name                  : "Anju Pulivarthi"
  links:

# Analytics
analytics:
  provider              : "false"

# Reading Files
include:
  - .htaccess
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Capfile
  - config
  - Dockerfile
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - local
  - log
  - node_modules
  - package.json*
  - Rakefile
  - README
  - tmp
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Collections
collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/

# Defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: false
      related: false
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
      share: false
      comments: false
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: false
      comments: false
  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: true
      share: false
      comment: false
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: true
      share: false

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed

# Outputting
permalink: /:categories/:title/
timezone: Etc/UTC

# Plugins
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

compress_html:
  clippings: all
  ignore:
    envs: development
